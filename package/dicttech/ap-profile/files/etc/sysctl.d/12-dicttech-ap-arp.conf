# Keep the dedicated setup port's default maintenance address on that port.
# Without this, Linux's weak-host ARP replies can expose it on br-setup and
# collide with other APs during batch enrollment. Managed addresses share one
# bridge interface and continue to work on every bridged port.
net.ipv4.conf.all.arp_ignore=1
net.ipv4.conf.default.arp_ignore=1
net.ipv4.conf.all.arp_announce=2
net.ipv4.conf.default.arp_announce=2

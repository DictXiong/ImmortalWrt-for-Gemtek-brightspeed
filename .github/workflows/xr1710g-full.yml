name: Build XR1710G Full

on:
  push:
    branches: [dicttech/xr1710g-ap]
  workflow_dispatch:
    inputs:
      wrtix_repository:
        description: wrtix repository override (owner/name); defaults to WRTIX_REPOSITORY or DictXiong/wrtix
        required: false
        type: string
      layout:
        description: XR1710G partition layout
        required: true
        default: legacy
        type: choice
        options: [legacy, ubi]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [gateway, ap]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch pinned wrtix source
        env:
          WRTIX_REPOSITORY: ${{ inputs.wrtix_repository || vars.WRTIX_REPOSITORY || 'DictXiong/wrtix' }}
        run: |
          [[ "$WRTIX_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo 'Set WRTIX_REPOSITORY to the published owner/repository.' >&2; exit 1; }
          revision=$(python3 -c 'import json; print(json.load(open("configs/wrtix-source.json"))["revision"])')
          git clone "https://github.com/$WRTIX_REPOSITORY.git" "$RUNNER_TEMP/wrtix"
          git -C "$RUNNER_TEMP/wrtix" checkout --detach "$revision"
          echo "WRTIX_SOURCE=$RUNNER_TEMP/wrtix" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses-dev libssl-dev openssl python3 python3-setuptools python3-jsonschema rsync unzip wget xsltproc zlib1g-dev file swig jq zsh vim-nox tmux qemu-user
      - name: Validate image gates and roaming
        run: sudo bash scripts/dicttech/check-regressions.sh host
      - name: Build locked public full image
        env:
          IMAGE_LAYOUT: ${{ inputs.layout || 'legacy' }}
          IMAGE_ROLE: ${{ matrix.role }}
        run: bash scripts/dicttech/build-full.sh --role "$IMAGE_ROLE" --layout "$IMAGE_LAYOUT" --jobs "$(nproc)" 2>&1 | tee "$RUNNER_TEMP/dicttech-build.log"
      - name: Exercise history and serial tools with the built ARM64 tools
        run: |
          rootfs=$(find build_dir/target-*/root-airoha -maxdepth 0 -type d -print -quit)
          test -n "$rootfs"
          sudo bash scripts/dicttech/check-regressions.sh rootfs "$rootfs" bin/targets/airoha/an7581
          python3 scripts/dicttech/check-ui-source.py \
            --jsmin staging_dir/hostpkg/bin/jsmin \
            --output bin/targets/airoha/an7581/dicttech-factory-source-tests.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test source UI and browser fixtures offline
        run: |
          npm install --prefix "$RUNNER_TEMP/dicttech-ui" --no-save playwright@1.59.1
          "$RUNNER_TEMP/dicttech-ui/node_modules/.bin/playwright" install --with-deps chromium
          node scripts/dicttech/test-ui.cjs --require-browser \
            --playwright-module "$RUNNER_TEMP/dicttech-ui/node_modules/playwright" \
            --output bin/targets/airoha/an7581/dicttech-ui-tests.json
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/dicttech-ui/node_modules/playwright" \
          BROWSER_EXECUTABLE="$(node -e 'process.stdout.write(require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/dicttech-ui/node_modules/playwright")" \
            node scripts/dicttech/tests/factory/frontend.cjs \
            | tee bin/targets/airoha/an7581/dicttech-factory-ui-tests.json
      - name: Upload unsigned candidate for local acceptance
        uses: actions/upload-artifact@v7
        with:
          name: xr1710g-full-${{ matrix.role }}-${{ inputs.layout || 'legacy' }}-${{ github.sha }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/dicttech-build.log
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*.manifest
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/dicttech-wrtix-source.tar
            bin/targets/airoha/an7581/dicttech-*.json
            bin/targets/airoha/an7581/*.audit.json
            bin/targets/airoha/an7581/dicttech-sha256sums
            bin/targets/airoha/an7581/dicttech-packages/**/*.apk

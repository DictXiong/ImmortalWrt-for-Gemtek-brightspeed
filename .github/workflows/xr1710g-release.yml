name: Build XR1710G release pair

on:
  workflow_dispatch:
    inputs:
      layout:
        description: 分区布局（不会转换引导程序）
        required: true
        default: legacy
        type: choice
        options: [legacy, ubi]
      release_tag:
        description: 新 Release 标签；留空仅生成候选产物，填写后创建一个中文草稿
        required: false
        default: ''
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      full_commit: ${{ steps.pins.outputs.full_commit }}
      fixes_commit: ${{ steps.pins.outputs.fixes_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Freeze and validate the two source commits
        id: pins
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          python3 scripts/dicttech/release.py plan > "$RUNNER_TEMP/release-plan.json"
          python3 - "$RUNNER_TEMP/release-plan.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          plan = json.load(open(sys.argv[1]))
          assert plan['release_commit'] == os.environ['FULL_SHA']
          print('full_commit=' + plan['release_commit'])
          print('fixes_commit=' + plan['fixes_commit'])
          PY
      - name: Check optional draft-release authorization before compiling
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] || { echo 'Invalid tag'; exit 1; }
          [[ -n "$GH_TOKEN" ]] || { echo 'Set RELEASE_TOKEN with Contents and Workflows write permission, or leave release_tag empty.' >&2; exit 1; }
          # Read only. GitHub checks the token's write permissions when creating
          # the release; do not mistake repository visibility for authorization.
          existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          [[ -z "$existing" ]] || { echo 'Use a new release tag'; exit 1; }
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/release-tags"; then echo 'Release already exists'; exit 1; fi
  build:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, fixes]
    steps:
      # The release controller always comes from the pinned personal commit.
      # prepare checks out the selected edition's exact source commit separately.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.full_commit }}
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file swig jq
      - name: Check pinned-source and artifact separation
        run: python3 scripts/dicttech/tests/test_release.py
      - name: Prepare the exact edition source
        env:
          FLAVOR: ${{ matrix.flavor }}
          LAYOUT: ${{ inputs.layout }}
          FULL_SHA: ${{ needs.plan.outputs.full_commit }}
          FIXES_SHA: ${{ needs.plan.outputs.fixes_commit }}
        run: |
          python3 scripts/dicttech/release.py prepare --flavor "$FLAVOR" --layout "$LAYOUT" \
            --directory "$RUNNER_TEMP/xr-release-$FLAVOR"
          python3 - "$RUNNER_TEMP/xr-release-$FLAVOR/source.json" <<'PY'
          import json, os, sys
          source = json.load(open(sys.argv[1]))
          assert source['release_commit'] == os.environ['FULL_SHA']
          assert source['fixes_commit'] == os.environ['FIXES_SHA']
          expected = os.environ['FULL_SHA'] if os.environ['FLAVOR'] == 'full' else os.environ['FIXES_SHA']
          assert source['source_commit'] == expected
          PY
      - name: Build and audit matched firmware and APKs
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -o pipefail
          python3 scripts/dicttech/release.py build --directory "$RUNNER_TEMP/xr-release-$FLAVOR" --jobs 2 \
            2>&1 | tee "$RUNNER_TEMP/xr-$FLAVOR-build.log"
      - name: Upload only the audited public edition
        uses: actions/upload-artifact@v7
        with:
          name: xr1710g-${{ matrix.flavor }}-${{ inputs.layout }}-${{ needs.plan.outputs.full_commit }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/xr-release-${{ matrix.flavor }}/public/*
      - name: Save build diagnostics separately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xr1710g-${{ matrix.flavor }}-build-log-${{ needs.plan.outputs.full_commit }}
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/xr-${{ matrix.flavor }}-build.log
  pair:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.full_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: xr1710g-*-${{ inputs.layout }}-${{ needs.plan.outputs.full_commit }}
          path: ${{ runner.temp }}/edition-artifacts
      - name: Verify both editions belong to the pinned source pair
        run: |
          python3 scripts/dicttech/release.py assemble --inputs "$RUNNER_TEMP/edition-artifacts" \
            --output "$RUNNER_TEMP/release-pair"
      - uses: actions/upload-artifact@v7
        with:
          name: xr1710g-release-pair-${{ inputs.layout }}-${{ needs.plan.outputs.full_commit }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/release-pair/*
  draft:
    needs: [plan, pair]
    if: inputs.release_tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.full_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: xr1710g-release-pair-${{ inputs.layout }}-${{ needs.plan.outputs.full_commit }}
          path: release-pair
      - name: Generate Chinese notes from the verified source pair
        run: |
          python3 scripts/dicttech/release.py notes --pair release-pair/release-pair.json \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Create one new draft containing both editions
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.full_commit }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] || { echo 'Invalid tag'; exit 1; }
          [[ -n "$GH_TOKEN" ]] || { echo 'RELEASE_TOKEN is required for draft creation.' >&2; exit 1; }
          # Repeat existence checks after compiling to avoid overwriting a tag
          # or release created while the two independent builders were running.
          existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          [[ -z "$existing" ]] || { echo 'Use a new release tag'; exit 1; }
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/release-tags"; then echo 'Release already exists'; exit 1; fi
          gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft \
            --title "XR1710G $RELEASE_TAG（定制版与通用修复版）" \
            --notes-file "$RUNNER_TEMP/release-notes.md" release-pair/*

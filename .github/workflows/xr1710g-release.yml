name: Build XR1710G Full roles

on:
  push:
    branches: [dicttech/xr1710g-ap]
  workflow_dispatch:
    inputs:
      wrtix_repository:
        description: wrtix repository override (owner/name); defaults to WRTIX_REPOSITORY or DictXiong/wrtix
        required: false
        type: string
      layout:
        description: 分区布局（不会转换引导程序）
        required: true
        default: legacy
        type: choice
        options: [legacy, ubi]
      release_tag:
        description: 新 Release 标签；留空仅生成候选产物，填写后创建一个中文草稿
        required: false
        default: ''
        type: string

# New candidate pushes supersede old candidates; an explicit release dispatch
# keeps its own immutable build and cannot be cancelled by a later push.
concurrency:
  group: xr1710g-full-${{ github.event_name }}-${{ github.ref }}-${{ inputs.layout || 'legacy' }}-${{ inputs.release_tag || 'candidate' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      full_commit: ${{ steps.pins.outputs.full_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Freeze and validate the source commit
        id: pins
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          python3 scripts/dicttech/release.py plan > "$RUNNER_TEMP/release-plan.json"
          python3 - "$RUNNER_TEMP/release-plan.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          plan = json.load(open(sys.argv[1]))
          assert plan['release_commit'] == os.environ['FULL_SHA']
          print('full_commit=' + plan['release_commit'])
          PY
      - name: Check optional draft-release authorization before compiling
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] || { echo 'Invalid tag'; exit 1; }
          expected_tag=$(python3 -c 'import json; print("v" + json.load(open("configs/xr1710g-release.json"))["version"])')
          [[ "$RELEASE_TAG" == "$expected_tag" ]] || { echo "Use the configured version tag: $expected_tag" >&2; exit 1; }
          [[ -n "$GH_TOKEN" ]] || { echo 'Set RELEASE_TOKEN with Contents and Workflows write permission, or leave release_tag empty.' >&2; exit 1; }
          # Read only. GitHub checks the token's write permissions when creating
          # the release; do not mistake repository visibility for authorization.
          existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          [[ -z "$existing" ]] || { echo 'Use a new release tag'; exit 1; }
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/release-tags"; then echo 'Release already exists'; exit 1; fi
  build:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [gateway, ap]
    steps:
      # The release controller always comes from the pinned Full commit.
      # Both roles build isolated checkouts of this same immutable source.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.full_commit }}
          fetch-depth: 0
      - name: Fetch pinned wrtix source
        env:
          WRTIX_REPOSITORY: ${{ inputs.wrtix_repository || vars.WRTIX_REPOSITORY || 'DictXiong/wrtix' }}
        run: |
          [[ "$WRTIX_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo 'Set WRTIX_REPOSITORY to the published owner/repository.' >&2; exit 1; }
          revision=$(python3 -c 'import json; print(json.load(open("configs/wrtix-source.json"))["revision"])')
          git clone "https://github.com/$WRTIX_REPOSITORY.git" "$RUNNER_TEMP/wrtix"
          git -C "$RUNNER_TEMP/wrtix" checkout --detach "$revision"
          echo "WRTIX_SOURCE=$RUNNER_TEMP/wrtix" >> "$GITHUB_ENV"
      - name: Fetch pinned wrtmesh source
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("configs/wrtmesh-source.json"))["revision"])')
          git clone https://github.com/DictXiong/wrtmesh.git "$RUNNER_TEMP/wrtmesh"
          git -C "$RUNNER_TEMP/wrtmesh" checkout --detach "$revision"
          echo "WRTMESH_SOURCE=$RUNNER_TEMP/wrtmesh" >> "$GITHUB_ENV"
      - name: Record hosted build capacity
        run: |
          nproc
          free -h
          df -h "$RUNNER_TEMP"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses-dev libssl-dev openssl python3 python3-setuptools python3-jsonschema rsync unzip wget xsltproc zlib1g-dev file swig jq zsh vim-nox tmux qemu-user
      - name: Validate the exact full source before building
        run: sudo --preserve-env=WRTMESH_SOURCE bash scripts/dicttech/check-regressions.sh host
      - name: Prepare the exact role source
        env:
          ROLE: ${{ matrix.role }}
          LAYOUT: ${{ inputs.layout || 'legacy' }}
          FULL_SHA: ${{ needs.plan.outputs.full_commit }}
        run: |
          python3 scripts/dicttech/release.py prepare --role "$ROLE" --layout "$LAYOUT" \
            --directory "$RUNNER_TEMP/xr-release-$ROLE"
          python3 - "$RUNNER_TEMP/xr-release-$ROLE/source.json" <<'PY'
          import json, os, sys
          source = json.load(open(sys.argv[1]))
          assert source['release_commit'] == os.environ['FULL_SHA']
          assert source['source_commit'] == os.environ['FULL_SHA']
          assert source['role'] == os.environ['ROLE']
          PY
      - name: Build and audit matched firmware and APKs
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -o pipefail
          python3 scripts/dicttech/release.py build --directory "$RUNNER_TEMP/xr-release-$ROLE" --jobs "$(nproc)" \
            2>&1 | tee "$RUNNER_TEMP/xr-$ROLE-build.log"
      - name: Exercise the full image's real ARM64 programs
        run: |
          source="$RUNNER_TEMP/xr-release-${{ matrix.role }}/source"
          rootfs=$(find "$source/build_dir" -maxdepth 2 -type d -name root-airoha -print -quit)
          test -n "$rootfs"
          sudo --preserve-env=WRTMESH_SOURCE bash "$source/scripts/dicttech/check-regressions.sh" rootfs "$rootfs" "$source/bin/targets/airoha/an7581"
      - name: Check built UI source identities
        run: |
          source="$RUNNER_TEMP/xr-release-${{ matrix.role }}/source"
          cd "$source"
          python3 scripts/dicttech/check-ui-source.py \
            --jsmin staging_dir/hostpkg/bin/jsmin \
            --output bin/targets/airoha/an7581/dicttech-factory-source-tests.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test source UI and browser fixtures offline
        working-directory: ${{ runner.temp }}/xr-release-${{ matrix.role }}/source
        run: |
          npm install --prefix "$RUNNER_TEMP/dicttech-ui" --no-save playwright@1.59.1
          "$RUNNER_TEMP/dicttech-ui/node_modules/.bin/playwright" install --with-deps chromium
          node scripts/dicttech/test-ui.cjs --require-browser \
            --playwright-module "$RUNNER_TEMP/dicttech-ui/node_modules/playwright" \
            --output bin/targets/airoha/an7581/dicttech-ui-tests.json
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/dicttech-ui/node_modules/playwright" \
          BROWSER_EXECUTABLE="$(node -e 'process.stdout.write(require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/dicttech-ui/node_modules/playwright")" \
            node scripts/dicttech/tests/factory/frontend.cjs \
            | tee bin/targets/airoha/an7581/dicttech-factory-ui-tests.json
          rootfs=$(find build_dir -maxdepth 2 -type d -name root-airoha -print -quit)
          test -n "$rootfs"
          WRTMESH_PLAYWRIGHT="$RUNNER_TEMP/dicttech-ui/node_modules/playwright" \
            node "$WRTMESH_SOURCE/tests/test-luci-browser.cjs" feeds/luci "$rootfs" \
            | tee bin/targets/airoha/an7581/dicttech-wrtmesh-ui-tests.log
      - name: Upload only the audited public role
        uses: actions/upload-artifact@v7
        with:
          name: xr1710g-full-${{ matrix.role }}-${{ inputs.layout || 'legacy' }}-${{ needs.plan.outputs.full_commit }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/xr-release-${{ matrix.role }}/public/*
      - name: Save build diagnostics separately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xr1710g-full-${{ matrix.role }}-build-log-${{ needs.plan.outputs.full_commit }}
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/xr-${{ matrix.role }}-build.log
      - name: Retain validation reports separately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xr1710g-validation-${{ matrix.role }}-${{ needs.plan.outputs.full_commit }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/xr-release-${{ matrix.role }}/source/bin/targets/airoha/an7581/dicttech-*tests.json
            ${{ runner.temp }}/xr-release-${{ matrix.role }}/source/bin/targets/airoha/an7581/dicttech-*-tests.log
  pair:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.full_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: xr1710g-full-*-${{ inputs.layout || 'legacy' }}-${{ needs.plan.outputs.full_commit }}
          path: ${{ runner.temp }}/edition-artifacts
      - name: Verify both roles share the pinned source and package policy
        run: |
          python3 scripts/dicttech/release.py assemble --inputs "$RUNNER_TEMP/edition-artifacts" \
            --output "$RUNNER_TEMP/release-pair"
      - uses: actions/upload-artifact@v7
        with:
          name: xr1710g-release-pair-${{ inputs.layout || 'legacy' }}-${{ needs.plan.outputs.full_commit }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/release-pair/*
  draft:
    needs: [plan, pair]
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.full_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: xr1710g-release-pair-${{ inputs.layout || 'legacy' }}-${{ needs.plan.outputs.full_commit }}
          path: release-pair
      - name: Generate Chinese notes from the verified role pair
        run: |
          python3 scripts/dicttech/release.py notes --pair release-pair/release-pair.json \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Create one new draft containing both Full roles
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.full_commit }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] || { echo 'Invalid tag'; exit 1; }
          expected_tag=$(python3 -c 'import json; print("v" + json.load(open("configs/xr1710g-release.json"))["version"])')
          [[ "$RELEASE_TAG" == "$expected_tag" ]] || { echo "Use the configured version tag: $expected_tag" >&2; exit 1; }
          [[ -n "$GH_TOKEN" ]] || { echo 'RELEASE_TOKEN is required for draft creation.' >&2; exit 1; }
          # Repeat existence checks after compiling to avoid overwriting a tag
          # or release created while the two independent role builders were running.
          existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          [[ -z "$existing" ]] || { echo 'Use a new release tag'; exit 1; }
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/release-tags"; then echo 'Release already exists'; exit 1; fi
          release_flags=()
          [[ "$RELEASE_TAG" != *-* ]] || release_flags+=(--prerelease)
          gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft "${release_flags[@]}" \
            --title "XR1710G $RELEASE_TAG（Full gateway／ap）" \
            --notes-file "$RUNNER_TEMP/release-notes.md" release-pair/*
